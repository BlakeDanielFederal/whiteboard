<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whiteboard</title>
    <link rel="stylesheet" href="/diff/reviewWebDiff.css" />
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; }
      #whiteboard { height: 100vh; }
      .whiteboard-web-menu {
        position: fixed; z-index: 1000; display: flex; flex-direction: column;
        min-width: 160px; padding: 4px; border-radius: 6px;
        background: Canvas; color: CanvasText;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.18);
        font: 13px system-ui, sans-serif;
      }
      .whiteboard-web-menu button {
        all: unset; padding: 6px 10px; border-radius: 4px; cursor: default;
      }
      .whiteboard-web-menu button:hover:not(:disabled),
      .whiteboard-web-menu button:focus-visible { background: color-mix(in srgb, CanvasText 10%, transparent); }
      .whiteboard-web-menu button:disabled { opacity: 0.45; }
      .whiteboard-web-toast {
        position: fixed; z-index: 1001; right: 16px; bottom: 16px;
        padding: 10px 14px; border-radius: 6px; max-width: 360px;
        background: Canvas; color: CanvasText; font: 13px system-ui, sans-serif;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        box-shadow: 0 6px 24px rgb(0 0 0 / 0.18);
      }
      .whiteboard-web-toast-error { border-color: #d8402c; }
    </style>
  </head>
  <body>
    <div id="whiteboard"></div>
    <script type="module" src="../src/web/web-entry.tsx"></script>
  </body>
</html>
